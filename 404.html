<title>Адиль Алдабергенов — финансовый консультант</title>
<script>
// GitHub Pages отдаёт 404 для любых путей глубже корня —
// возвращаем человека на сайт, сохранив путь в hash-роут
(function () {
  var p = location.pathname.replace(/^\/adil-finance/, '') || '/';
  location.replace('/adil-finance/#' + p);
})();
</script>
